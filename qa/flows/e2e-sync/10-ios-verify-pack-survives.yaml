# E2E two-device sync — iOS pass 4: D1 from the seat of the person who made
# the pack. Their tap is still honoured after the partner re-minted the same
# seed rows, and the two devices agree on the same count.
appId: com.joshapproved.packinglist
---
- waitForAnimationToEnd:
    timeout: 8000
- extendedWaitUntil:
    visible:
      text: "1 of 10 packed"
    timeout: 30000
- takeScreenshot: qa/captures/e2e-sync/10-ios-pack-survived
