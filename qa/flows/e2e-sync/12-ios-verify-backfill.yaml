# E2E two-device sync — iOS pass 5: relaunch after being killed (NO
# clearState) and prove the cold-start hello backfill pulls what Android wrote
# while iOS was dead — plus that everything earlier persisted across the
# process death (the pack, the blind add, the re-minted seed rows).
appId: com.joshapproved.packinglist
---
- launchApp
- extendedWaitUntil:
    visible:
      text: "Greece.*"
    timeout: 20000
- tapOn:
    text: "Greece.*"
- extendedWaitUntil:
    visible:
      text: "Packers"
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: "1 of 11 packed"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: ".*Windsock.*"
    direction: DOWN
    timeout: 20000
- takeScreenshot: qa/captures/e2e-sync/12-ios-backfilled
