# E2E two-device sync — iOS pass 5: D1 from the seat of the person who made
# the pack. Their tap is still honoured after the partner independently minted
# the same seed rows later, and the two devices agree on the same count.
#
# Convergence is only real when both seats agree, so this is the same exact
# oracle as pass 10 ("2 of 20 packed"), read from the other device. Pre-fix it
# reads "1 of 20 packed" here too — that is what made the defect so bad: the
# person who packed the item watched it untick itself.
appId: com.joshapproved.packinglist
---
# Dwell for Android's reconnect + hello + publish to land.
- waitForAnimationToEnd:
    timeout: 8000
- extendedWaitUntil:
    visible:
      text: "2 of 20 packed"
    timeout: 40000
- scrollUntilVisible:
    element:
      text: ".*Hiking boots.*"
    direction: DOWN
    timeout: 30000
- takeScreenshot: qa/captures/e2e-sync/11-ios-pack-survived
- scrollUntilVisible:
    element:
      text: "Packers"
    direction: UP
    timeout: 20000
