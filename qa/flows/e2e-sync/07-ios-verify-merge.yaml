# E2E two-device sync — iOS pass 3: the same merge from iOS's seat. Its pack
# survived AND Android's blind add arrived, so both devices show the identical
# "1 of 10 packed". Convergence is only real when both seats agree.
appId: com.joshapproved.packinglist
---
# Dwell for reconnect + hello + publish to land.
- waitForAnimationToEnd:
    timeout: 8000
- extendedWaitUntil:
    visible:
      text: "1 of 10 packed"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: ".*Ukulele.*"
    direction: DOWN
    timeout: 20000
- takeScreenshot: qa/captures/e2e-sync/07-ios-merged
- scrollUntilVisible:
    element:
      text: "Packers"
    direction: UP
    timeout: 15000
