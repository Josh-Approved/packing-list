# E2E two-device sync — iOS pass 6: relaunch after being killed (NO
# clearState) and prove the cold-start hello backfill pulls what Android wrote
# while iOS was dead — plus that everything earlier persisted across the
# process death (both packs, the blind add, and the seed rows the Hiking type
# added on both devices independently).
appId: com.joshapproved.packinglist
---
- launchApp
- extendedWaitUntil:
    visible:
      text: "Greece.*"
    timeout: 20000
- tapOn:
    text: "Greece.*"
- extendedWaitUntil:
    visible:
      text: "Packers"
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: "2 of 21 packed"
    timeout: 40000
- scrollUntilVisible:
    element:
      text: ".*Windsock.*"
    direction: DOWN
    timeout: 30000
- takeScreenshot: qa/captures/e2e-sync/13-ios-backfilled
